<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        :root {
            --bg: white;
            --text: black;
            --primary: #4f46e5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* Header - Flexbox */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--primary);
            color: white;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* Main */
        .intro {
            text-align: center;
            padding: 50px 20px;
        }

        button {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
        }

        /* CSS Grid */
        .skills {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .card {
            padding: 25px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--primary);
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 600px) {

            header {
                flex-direction: column;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }

            .skills {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Portfolio</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="intro">
        <h2>Hello, I'm Kalpana</h2>
        <p>Java Full Stack Developer</p>
        <button>View My Work</button>
    </section>

    <section class="skills">

        <div class="card">
            <h3>HTML</h3>
            <p>Creating web pages</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Designing websites</p>
        </div>

        <div class="card">
            <h3>Java</h3>
            <p>Developing applications</p>
        </div>

    </section>

    <footer>
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
