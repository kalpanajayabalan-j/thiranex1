<!DOCTYPE html>
<html>
<head>
    <title>Simple To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 60%;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

        li {
            list-style: none;
            padding: 10px;
            margin: 5px;
            background: #eee;
        }

        .done {
            text-decoration: line-through;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>To-Do List</h2>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <br>

    <button onclick="showAll()">All</button>
    <button onclick="showActive()">Active</button>
    <button onclick="showCompleted()">Completed</button>

    <ul id="taskList"></ul>
</div>

<script>

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function displayTasks(list = tasks) {

    let taskList = document.getElementById("taskList");

    taskList.innerHTML = "";

    list.forEach((task, index) => {

        let li = document.createElement("li");

        if (task.completed) {
            li.classList.add("done");
        }

        li.innerHTML = `
            ${task.name}
            <br>
            <button onclick="completeTask(${index})">Done</button>
            <button onclick="editTask(${index})">Edit</button>
            <button onclick="deleteTask(${index})">Delete</button>
        `;

        taskList.appendChild(li);
    });
}

function addTask() {

    let input = document.getElementById("taskInput");

    if (input.value == "") {
        alert("Enter a task");
        return;
    }

    tasks.push({
        name: input.value,
        completed: false
    });

    input.value = "";

    saveTasks();
    displayTasks();
}

function completeTask(index) {

    tasks[index].completed = !tasks[index].completed;

    saveTasks();
    displayTasks();
}

function editTask(index) {

    let newTask = prompt("Edit task:", tasks[index].name);

    if (newTask != null && newTask != "") {
        tasks[index].name = newTask;
    }

    saveTasks();
    displayTasks();
}

function deleteTask(index) {

    tasks.splice(index, 1);

    saveTasks();
    displayTasks();
}

function showAll() {
    displayTasks(tasks);
}

function showActive() {

    let active = tasks.filter(task => task.completed == false);

    displayTasks(active);
}

function showCompleted() {

    let completed = tasks.filter(task => task.completed == true);

    displayTasks(completed);
}

function saveTasks() {

    localStorage.setItem("tasks", JSON.stringify(tasks));
}

displayTasks();

</script>

</body>
</html>
